[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "chickflow"
version = "2.3.0"
description = "Synthetic restaurant operations analytics"
requires-python = ">=3.12,<3.13"
dependencies = [
  "pandas", "numpy", "matplotlib", "seaborn", "plotly>=6", "streamlit>=1.42",
  "wordcloud", "PyYAML", "tzdata",
]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
